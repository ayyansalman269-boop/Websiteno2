<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutra Hair Care</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f8; color: #333; }
    header { background: #1b4332; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .header-btns { display: flex; gap: 10px; }
    .btn { background: #2d6a4f; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-admin { background: #d97706; }
    .btn-danger { background: #dc2626; }
    .btn-secondary { background: #4b5563; }
    .cart-count { background: #e76f51; color: white; border-radius: 50%; padding: 2px 7px; font-size: 0.8rem; margin-left: 5px; }

    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem; }
    .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
    .product-card img { width: 100%; height: 220px; object-fit: cover; }
    .product-info { padding: 1rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-title { font-size: 1.1rem; margin-bottom: 0.5rem; font-weight: 600; }
    .product-price { font-size: 1.2rem; color: #2d6a4f; font-weight: bold; margin-bottom: 1rem; }
    
    /* Cart Sidebar */
    .cart-sidebar { position: fixed; top: 0; right: -400px; width: 350px; height: 100%; background: white; box-shadow: -4px 0 15px rgba(0,0,0,0.1); transition: right 0.3s ease; z-index: 1000; display: flex; flex-direction: column; }
    .cart-sidebar.open { right: 0; }
    .cart-header { background: #1b4332; color: white; padding: 1.2rem; display: flex; justify-content: space-between; align-items: center; }
    .cart-items { padding: 1rem; flex-grow: 1; overflow-y: auto; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.8rem; }
    .cart-footer { padding: 1.2rem; border-top: 1px solid #eee; background: #fafafa; }
    .cart-total { display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: bold; margin-bottom: 1rem; }

    /* Modal / Admin Styles */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; overflow-y: auto; justify-content: center; align-items: center; }
    .modal.open { display: flex; }
    .modal-content { background: white; padding: 2rem; border-radius: 12px; max-width: 800px; width: 90%; max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 600; }
    .form-group input { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: #e0f2fe; padding: 1.5rem; border-radius: 8px; text-align: center; }
    .stat-card h3 { font-size: 1.8rem; color: #0369a1; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem; border: 1px solid #e5e7eb; text-align: left; font-size: 0.9rem; }
    th { background: #f3f4f6; }
  </style>
</head>
<body>

  <header>
    <h1>Nutra Hair Care</h1>
    <div class="header-btns">
      <button class="btn btn-admin" onclick="openAdminModal()">Admin Panel</button>
      <button class="btn" onclick="toggleCart()">🛒 Cart <span class="cart-count" id="cartCount">0</span></button>
    </div>
  </header>

  <div class="container">
    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- Cart Sidebar -->
  <div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button class="btn btn-danger" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cartTotal">PKR 0</span>
      </div>
      <button class="btn" style="width:100%" onclick="openCheckoutModal()">Proceed to Checkout</button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="modal" id="checkoutModal">
    <div class="modal-content">
      <h2>Complete Your Order</h2>
      <form id="checkoutForm" onsubmit="handleCheckout(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="custName" required>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="custPhone" required>
        </div>
        <div class="form-group">
          <label>Shipping Address</label>
          <input type="text" id="custAddress" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Place Order</button>
        <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 8px;" onclick="closeModal('checkoutModal')">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Admin Modal -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>Dashboard & Management</h2>
        <button class="btn btn-danger" onclick="closeModal('adminModal')">&times;</button>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <p>Total Revenue</p>
          <h3 id="statRevenue">PKR 0</h3>
        </div>
        <div class="stat-card">
          <p>Total Orders</p>
          <h3 id="statOrders">0</h3>
        </div>
      </div>

      <!-- Add Product Form -->
      <div style="background: #f8fafc; padding: 1rem; border-radius: 8px; margin-bottom: 2rem;">
        <h3 id="formTitle">Add New Product</h3>
        <form id="productForm" onsubmit="saveProduct(event)">
          <input type="hidden" id="editProductId">
          <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="prodName" required>
          </div>
          <div class="form-group">
            <label>Price (PKR)</label>
            <input type="number" id="prodPrice" required>
          </div>
          <div class="form-group">
            <label>Product Image (Upload File Direct)</label>
            <input type="file" id="prodImage" accept="image/*">
          </div>
          <button type="submit" class="btn">Save Product</button>
          <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;" onclick="resetProductForm()">Cancel Edit</button>
        </form>
      </div>

      <!-- Product List Management -->
      <h3>Manage Inventory</h3>
      <table style="margin-bottom: 2rem;">
        <thead>
          <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Price</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="adminProductTable"></tbody>
      </table>

      <!-- Order List Management -->
      <h3>Orders List</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="adminOrderTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Initial Data Setup
    let products = JSON.parse(localStorage.getItem('nutra_products')) || [
      { id: 1, name: "Nutra Herbal Hair Growth Oil", price: 1500, image: "https://images.unsplash.com/photo-1608248597369-2a912555e7ce?auto=format&fit=crop&w=800&q=80" }
    ];
    let orders = JSON.parse(localStorage.getItem('nutra_orders')) || [];
    let cart = [];

    function saveData() {
      localStorage.setItem('nutra_products', JSON.stringify(products));
      localStorage.setItem('nutra_orders', JSON.stringify(orders));
    }

    // Render Store Front
    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.image}" alt="${p.name}">
          <div class="product-info">
            <div>
              <div class="product-title">${p.name}</div>
              <div class="product-price">PKR ${p.price}</div>
            </div>
            <button class="btn" style="width:100%" onclick="addToCart(${p.id})">Add to Cart</button>
          </div>
        </div>
      `).join('');
    }

    // Cart Operations
    function addToCart(id) {
      const item = cart.find(i => i.id === id);
      if (item) item.quantity++;
      else {
        const product = products.find(p => p.id === id);
        cart.push({ ...product, quantity: 1 });
      }
      updateCartUI();
      document.getElementById('cartSidebar').classList.add('open');
    }

    function updateCartUI() {
      const cartItems = document.getElementById('cartItems');
      const totalCount = cart.reduce((sum, i) => sum + i.quantity, 0);
      const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
      
      document.getElementById('cartCount').textContent = totalCount;
      document.getElementById('cartTotal').textContent = `PKR ${totalPrice}`;

      cartItems.innerHTML = cart.length === 0 
        ? '<p style="text-align:center; color:#888; margin-top:2rem;">Your cart is empty.</p>'
        : cart.map(i => `
          <div class="cart-item">
            <div>
              <strong>${i.name}</strong><br>
              <small>PKR ${i.price} x ${i.quantity}</small>
            </div>
            <strong>PKR ${i.price * i.quantity}</strong>
          </div>
        `).join('');
    }

    function toggleCart() { document.getElementById('cartSidebar').classList.toggle('open'); }
    function openCheckoutModal() {
      if (cart.length === 0) return alert('Cart is empty!');
      toggleCart();
      document.getElementById('checkoutModal').classList.add('open');
    }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    // Checkout Handling
    function handleCheckout(e) {
      e.preventDefault();
      const newOrder = {
        id: Date.now(),
        name: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value,
        address: document.getElementById('custAddress').value,
        items: cart.map(i => `${i.name} (${i.quantity})`).join(', '),
        total: cart.reduce((sum, i) => sum + (i.price * i.quantity), 0),
        date: new Date().toLocaleDateString()
      };
      orders.push(newOrder);
      cart = [];
      saveData();
      updateCartUI();
      closeModal('checkoutModal');
      document.getElementById('checkoutForm').reset();
      alert('Order placed successfully!');
    }

    // Admin Operations
    function openAdminModal() {
      renderAdminData();
      document.getElementById('adminModal').classList.add('open');
    }

    function renderAdminData() {
      // Revenue & Stats
      const totalRev = orders.reduce((sum, o) => sum + o.total, 0);
      document.getElementById('statRevenue').textContent = `PKR ${totalRev}`;
      document.getElementById('statOrders').textContent = orders.length;

      // Products Table
      document.getElementById('adminProductTable').innerHTML = products.map(p => `
        <tr>
          <td><img src="${p.image}" style="width:40px;height:40px;object-fit:cover;border-radius:4px;"></td>
          <td>${p.name}</td>
          <td>PKR ${p.price}</td>
          <td>
            <button class="btn btn-admin" style="padding:0.3rem 0.6rem;font-size:0.8rem;" onclick="editProduct(${p.id})">Edit</button>
            <button class="btn btn-danger" style="padding:0.3rem 0.6rem;font-size:0.8rem;" onclick="deleteProduct(${p.id})">Delete</button>
          </td>
        </tr>
      `).join('');

      // Orders Table
      document.getElementById('adminOrderTable').innerHTML = orders.map(o => `
        <tr>
          <td>#${o.id}</td>
          <td>${o.name}<br><small>${o.phone}</small></td>
          <td>${o.items}</td>
          <td>PKR ${o.total}</td>
          <td>${o.date}</td>
        </tr>
      `).join('');
    }

    // Direct Image Upload & Product Storage
    function saveProduct(e) {
      e.preventDefault();
      const editId = document.getElementById('editProductId').value;
      const name = document.getElementById('prodName').value;
      const price = parseFloat(document.getElementById('prodPrice').value);
      const imageFile = document.getElementById('prodImage').files[0];

      const proceedSave = (imgUrl) => {
        if (editId) {
          const index = products.findIndex(p => p.id == editId);
          products[index].name = name;
          products[index].price = price;
          if (imgUrl) products[index].image = imgUrl;
        } else {
          products.push({
            id: Date.now(),
            name,
            price,
            image: imgUrl || 'https://images.unsplash.com/photo-1608248597369-2a912555e7ce?auto=format&fit=crop&w=800&q=80'
          });
        }
        saveData();
        renderProducts();
        renderAdminData();
        resetProductForm();
      };

      if (imageFile) {
        const reader = new FileReader();
        reader.onloadend = () => proceedSave(reader.result);
        reader.readAsDataURL(imageFile);
      } else {
        proceedSave(null);
      }
    }

    function editProduct(id) {
      const p = products.find(prod => prod.id === id);
      document.getElementById('editProductId').value = p.id;
      document.getElementById('prodName').value = p.name;
      document.getElementById('prodPrice').value = p.price;
      document.getElementById('formTitle').textContent = "Edit Product";
      document.getElementById('cancelEditBtn').style.display = "inline-block";
    }

    function resetProductForm() {
      document.getElementById('productForm').reset();
      document.getElementById('editProductId').value = '';
      document.getElementById('formTitle').textContent = "Add New Product";
      document.getElementById('cancelEditBtn').style.display = "none";
    }

    function deleteProduct(id) {
      if (confirm('Delete this product?')) {
        products = products.filter(p => p.id !== id);
        saveData();
        renderProducts();
        renderAdminData();
      }
    }

    renderProducts();
  </script>
</body>
</html>
